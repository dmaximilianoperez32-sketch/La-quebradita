<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="La Quebradita Amoblamientos · Encuesta de Remodelación">
    <meta property="og:description" content="Diseño exclusivo y amoblamientos a medida. Completá la encuesta y cotizá tu próximo proyecto de forma online.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1556911220-e15b29be8c8f?q=80&w=600&auto=format&fit=crop">
    <meta property="og:site_name" content="La Quebradita">

    <title>La Quebradita Amoblamientos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #18bc9c;
            --bg: #f8f9fa;
            --text: #333333;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--white);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 750px;
            width: 100%;
            margin-bottom: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 15px;
        }

        /* 🖼️ DISEÑO DE LA GALERÍA DE TRABAJOS */
        .section-title {
            color: var(--primary);
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .gallery-item {
            background: var(--bg);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: transform 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-5px);
        }

        .gallery-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .gallery-info {
            padding: 12px;
            text-align: center;
        }

        .gallery-info h4 {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
        }

        .gallery-info p {
            color: #7f8c8d;
            font-size: 12px;
            margin-top: 2px;
        }

        /* ESTILOS DEL FORMULARIO */
        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"], input[type="tel"], select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            color: var(--text);
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus, input[type="tel"]:focus, select:focus {
            border-color: var(--secondary);
        }

        .btn-submit {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-submit:hover {
            background-color: #1a252f;
            transform: translateY(-2px);
        }

        /* 🟢 BOTÓN FLOTANTE DE WHATSAPP */
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25d366;
            color: white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            z-index: 100;
            transition: transform 0.3s;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }

        .whatsapp-float svg {
            width: 32px;
            height: 32px;
            fill: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>La Quebradita</h1>
            <p>Diseño de Amoblamientos & Proyectos a Medida</p>
        </div>

        <h3 class="section-title">Algunos de nuestros diseños</h3>
        <div class="gallery-grid">
            
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1556911220-e15b29be8c8f?q=80&w=400&auto=format&fit=crop" alt="Cocina">
                <div class="gallery-info">
                    <h4>Amoblamientos de Cocina</h4>
                    <p>Diseño y optimización en MDF</p>
                </div>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1620626011161-997c51447094?q=80&w=400&auto=format&fit=crop" alt="Baño">
                <div class="gallery-info">
                    <h4>Vanitorys y Baños</h4>
                    <p>Muebles a medida funcionales</p>
                </div>
            </div>

            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1558882224-cca166733360?q=80&w=400&auto=format&fit=crop" alt="Vestidor">
                <div class="gallery-info">
                    <h4>Placards y Vestidores</h4>
                    <p>Máxima capacidad de guardado</p>
                </div>
            </div>

        </div>

        <h3 class="section-title">Cotizá tu proyecto online</h3>
        <form action="https://formsubmit.co/dmaximilianoperez32@gmail.com" method="POST">
            
            <input type="hidden" name="_subject" value="Nuevo Presupuesto de Amoblamiento - La Quebradita">
            <input type="hidden" name="_captcha" value="false">
            
            <input type="hidden" name="_template" value="table">

            <div class="form-group">
                <label for="nombre">Nombre y Apellido</label>
                <input type="text" id="nombre" name="Nombre del Cliente" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono de Contacto (WhatsApp)</label>
                <input type="tel" id="telefono" name="Telefono de Contacto" placeholder="Ej: 3815555555" required>
            </div>

            <div class="form-group">
                <label for="amoblamiento">¿Qué tipo de amoblamiento estás buscando?</label>
                <select id="amoblamiento" name="Tipo de Mueble" required>
                    <option value="" disabled selected>Seleccioná una opción...</option>
                    <option value="Cocina Completa">Cocina Completa</option>
                    <option value="Bajo Mesada / Alacena">Bajo Mesada / Alacena</option>
                    <option value="Vanitory / Baño">Vanitory / Baño</option>
                    <option value="Placard / Vestidor">Placard / Vestidor</option>
                    <option value="Comercial / Exhibidores">Módulo Comercial / Exhibidor</option>
                    <option value="Otro">Otro amoblamiento a medida</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ambiente">¿Cómo definirías el estado actual de tu ambiente?</label>
                <select id="ambiente" name="Estado del Ambiente" required>
                    <option value="" disabled selected>Seleccioná una opción...</option>
                    <option value="En obra gris / Construcción">En obra gris / Construcción</option>
                    <option value="Listo para colocar el mueble">Terminado (Listo para colocar el mueble)</option>
                    <option value="Remodelación (Hay que retirar un mueble viejo)">Remodelación (Hay que retirar un mueble viejo)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="presupuesto">¿Tenés un presupuesto estimado asignado al proyecto?</label>
                <select id="presupuesto" name="Presupuesto Estimado" required>
                    <option value="" disabled selected>Seleccioná una opción...</option>
                    <option value="Económico / Funcional">Económico / Busco lo más funcional</option>
                    <option value="Estándar / Buena calidad">Estándar / Busco equilibrio precio-calidad</option>
                    <option value="Premium / Materiales exclusivos">Premium / Busco materiales y herrajes top</option>
                </select>
            </div>

            <div class="form-group">
                <label for="estilo">¿Qué terminación o estilo visual preferís?</label>
                <select id="estilo" name="Estilo Visual" required>
                    <option value="" disabled selected>Seleccioná una opción...</option>
                    <option value="Moderno">Moderno (Líneas limpias y colores actuales)</option>
                    <option value="Minimalista">Minimalista </option>
                    <option value="Industrial">Industrial </option>
                    <option value="Nórdico">Nórdico </option>
                    <option value="Clásico">Clásico </option>
                </select>
            </div>

            <div class="form-group">
                <label for="plazo">¿Para cuándo estimás realizar la instalación?</label>
                <select id="plazo" name="Plazo de Entrega" required>
                    <option value="" disabled selected>Seleccioná una opción...</option>
                    <option value="Lo antes posible">Lo antes posible (Menos de 15 días)</option>
                    <option value="Próximo mes">Dentro del próximo mes</option>
                    <option value="A planificar">A planificar a mediano plazo (Más de 30 días)</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Enviar Solicitud de Cotización</button>
        </form>
    </div>

    <a href="https://wa.me/543815814062" class="whatsapp-float" target="_blank" title="Contactar por WhatsApp">
        <svg viewBox="0 0 32 32">
            <path d="M16 2a13 13 0 0 0-11.3 19.4L3 29l7.8-2A13 13 0 1 0 16 2zm6.6 18.3c-.3.8-1.5 1.5-2.1 1.6-.6.1-1.3.2-3.7-.8-2.9-1.2-4.8-4.1-5-4.3-.1-.2-1.3-1.8-1.3-3.4 0-1.6.8-2.4 1.1-2.7.3-.3.6-.4.8-.4h.5c.2 0 .4 0 .6.4.2.5.8 2 .9 2.2.1.2.1.4-.1.7-.1.2-.3.5-.5.7-.2.2-.4.4-.2.7.3.5.9 1.7 1.8 2.5 1.1 1 2-1.3 2.5-1 .5.3 3 1.4 3.1 1.5.1.1.2.3.1.5-.1.5-.7 1.3-1.3 1.6z"/>
        </svg>
    </a>

</body>
</html>
